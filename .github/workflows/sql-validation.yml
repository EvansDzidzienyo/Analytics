name: SQL validation

on:
  pull_request:
    paths:
      - "DataAnalysis/**/*.sql"
      - ".github/workflows/sql-validation.yml"
  push:
    branches:
      - improvement/sql-analytics-documentation

jobs:
  mysql-validation:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portfolio
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - name: Create schema
        run: mysql -h 127.0.0.1 -uroot -proot portfolio < DataAnalysis/Tables.sql
      - name: Load sample records
        run: mysql -h 127.0.0.1 -uroot -proot portfolio < DataAnalysis/Insertions.sql
      - name: Execute analytical queries
        run: mysql -h 127.0.0.1 -uroot -proot portfolio < DataAnalysis/Queries.sql
